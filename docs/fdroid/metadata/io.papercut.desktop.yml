Builds:
  - versionName: 1.10.0
    versionCode: 1010000
    commit: v1.10.0
    output: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    prebuild:
      - npm ci
      - find node_modules/tesseract.js-core -maxdepth 1 -name 'tesseract-core*.wasm.js'
        -type f -delete
      - rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
    scanignore:
      - node_modules/@tesseract.js-data/ara/4.0.0_best_int/ara.traineddata.gz
      - node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz
    scandelete:
      - node_modules/@esbuild/linux-x64/bin/esbuild
      - node_modules/esbuild/bin/esbuild
      - node_modules/@pagefind/linux-x64/bin/pagefind_extended
      - node_modules/@tesseract.js-data/ara/4.0.0/ara.traineddata.gz
      - node_modules/@tesseract.js-data/eng/4.0.0/eng.traineddata.gz
      - node_modules/pdfjs-dist/wasm
      - node_modules/tesseract.js-core/tesseract-core*.wasm
    build:
      - node scripts/fdroid/build-source-esbuild.js
      - export ESBUILD_BINARY_PATH="$PWD/.cache/android-production/host-tools/esbuild"
      - task_gradle=$(command -v gradle)
      - PAPERCUT_GRADLE="$task_gradle" bash scripts/fdroid/build-android-release.sh
    ndk: 30.0.16248370

