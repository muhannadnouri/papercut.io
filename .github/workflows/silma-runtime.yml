name: SILMA Runtime Pack

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag to upload to, for example v1.6.0"
        required: false
        type: string
      artifact_url:
        description: "Optional final URL to write into the generated runtime manifest"
        required: false
        type: string
      upload_to_release:
        description: "Upload the runtime pack to the GitHub Release named by tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SILMA_RUNTIME_ARCHIVE: papercut-silma-runtime-linux-x64-cpu.tar.bz2

jobs:
  build-linux-x64-cpu:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecars/silma/requirements.txt

      - name: Install SILMA sidecar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecars/silma/requirements.txt pyinstaller

      - name: Build packaged worker
        run: |
          node scripts/prepare-silma-sidecar.js \
            --python "$(command -v python)" \
            --target x86_64-unknown-linux-gnu \
            --mode onedir \
            --clean \
            --self-test

      - name: Package runtime archive
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_URL: ${{ inputs.artifact_url }}
        run: |
          runtime_url="$INPUT_URL"
          if [ -z "$runtime_url" ] && [ -n "$INPUT_TAG" ]; then
            runtime_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${INPUT_TAG}/${SILMA_RUNTIME_ARCHIVE}"
          fi

          args=(
            --target x86_64-unknown-linux-gnu
            --archive-name "$SILMA_RUNTIME_ARCHIVE"
          )
          if [ -n "$runtime_url" ]; then
            args+=(--url "$runtime_url")
          fi
          node scripts/package-silma-runtime-pack.js "${args[@]}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: papercut-silma-runtime-linux-x64-cpu
          path: |
            sidecars/silma/runtime/x86_64-unknown-linux-gnu/archive/*.tar.bz2
            sidecars/silma/runtime/x86_64-unknown-linux-gnu/archive/*.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release
        if: inputs.upload_to_release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            echo "tag is required when upload_to_release is true" >&2
            exit 1
          fi
          gh release upload "$INPUT_TAG" \
            sidecars/silma/runtime/x86_64-unknown-linux-gnu/archive/*.tar.bz2 \
            sidecars/silma/runtime/x86_64-unknown-linux-gnu/archive/*.manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
