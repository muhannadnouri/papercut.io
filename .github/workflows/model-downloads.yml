name: Model Downloads

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Check metadata, test installs, or prepare an original/paired model draft"
        required: true
        default: full
        type: choice
        options: [metadata, full, prepare-mirror, prepare-distills]

permissions:
  contents: read

concurrency:
  group: model-downloads-${{ github.event.schedule || inputs.mode }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ponytail: monitor the current manifest; add supported-client versions with the remote catalog.
  metadata:
    if: inputs.mode != 'prepare-mirror' && inputs.mode != 'prepare-distills'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test scripts/checks/__tests__/check-model-downloads-selftest.js
      - name: Check production asset identities and immutability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/checks/check-model-downloads.js

  smoke:
    needs: metadata
    if: >-
      always() && !cancelled() &&
      (inputs.mode == 'prepare-mirror' || inputs.mode == 'prepare-distills' ||
       (needs.metadata.result == 'success' &&
        (inputs.mode == 'full' || github.event.schedule == '41 8 * * *')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: model-smoke
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          mkdir -p src-tauri/tts/runtime/linux-x64-shared-libs-2.0.1
      - name: Download and verify fresh archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = prepare-distills ]; then
            node scripts/checks/prepare-model-archives.js --out "$RUNNER_TEMP/model-archives" --check-manifest
          else
            args=(--download-dir "$RUNNER_TEMP/model-archives")
            if [ "$MODE" = prepare-mirror ]; then
              args+=(--upstream --model-name kokoro-multi-lang-v1_0)
            fi
            node scripts/checks/check-model-downloads.js "${args[@]}"
          fi
      - name: Test the production verifier, extractor, voice mappings, and synthesis
        env:
          PAPERCUT_MODEL_ARCHIVE_DIR: ${{ runner.temp }}/model-archives
          MODE: ${{ inputs.mode }}
          ORT_LIB_LOCATION: ${{ github.workspace }}/src-tauri/target/sherpa-onnx-prebuilt/sherpa-onnx-v2.0.1-linux-x64-shared-lib/lib
        run: |
          if [ "$MODE" = prepare-mirror ]; then export PAPERCUT_SMOKE_KOKORO_ONLY=1; fi
          cargo test --manifest-path src-tauri/Cargo.toml --locked --features native-tts-shared --lib
          if [ "$MODE" = prepare-distills ]; then
            for model in $(jq -r '.archives[].modelName' "$PAPERCUT_MODEL_ARCHIVE_DIR/model-manifest.json"); do
              PAPERCUT_SMOKE_ARCHIVE_NAME="$model" cargo test --manifest-path src-tauri/Cargo.toml --locked --features native-tts-shared --lib model_archive_smoke -- --ignored --nocapture
            done
          else
            cargo test --manifest-path src-tauri/Cargo.toml --locked --features native-tts-shared --lib model_archive_smoke -- --ignored --nocapture
          fi
      - name: Complete the original mirror review packet
        if: inputs.mode == 'prepare-mirror'
        run: |
          cp src-tauri/tts/model-manifest.json "$RUNNER_TEMP/model-archives/"
          (cd "$RUNNER_TEMP/model-archives" && sha256sum kokoro-multi-lang-v1_0.tar.bz2 > SHA256SUMS.txt)
      - name: Preserve the validated model release packet
        if: inputs.mode == 'prepare-mirror' || inputs.mode == 'prepare-distills'
        uses: actions/upload-artifact@v7
        with:
          name: validated-model-release
          path: |
            ${{ runner.temp }}/model-archives/*.tar.bz2
            ${{ runner.temp }}/model-archives/SHA256SUMS.txt
            ${{ runner.temp }}/model-archives/model-manifest.json
          if-no-files-found: error
          retention-days: 7

  model-draft:
    needs: smoke
    # Preparation skips metadata; bypass inherited skip status only after successful smoke.
    if: ${{ !cancelled() && needs.smoke.result == 'success' && (inputs.mode == 'prepare-mirror' || inputs.mode == 'prepare-distills') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: validated-model-release
          path: model-assets
      - name: Create a draft without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = prepare-distills ]; then
            tag="$(jq -r '.packaging.releaseTag' src-tauri/tts/qualification-artifacts.json)"
            title="Kokoro and Nabra 7M FP32 model artifacts"
            notes=(--notes "Paired single-voice FP32 artifacts. Retain both model archives and the matching Piper/eSpeak corresponding-source companion. Verify SHA256SUMS.txt and the committed model manifest; review the Stage 4c gates in docs/sherpa-onnx-upgrade.md before publishing as an immutable, non-latest release.")
          else
            url="$(jq -r '.archives[] | select(.modelName == "kokoro-multi-lang-v1_0") | .url' src-tauri/tts/model-manifest.json)"
            tag="$(basename "$(dirname "$url")")"
            title="Kokoro v1.0 model artifact (2026-09-08)"
            notes=(--notes-file docs/kokoro-model-release.md)
          fi
          gh release create "$tag" model-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --latest=false --title "$title" "${notes[@]}"
