[package]
name = "app"
version = "1.7.4"
description = "Search, Read, & Listen Offline"
authors = ["Muhannad"]
license = "MIT"
repository = "https://github.com/muhannadnouri/papercut.io"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[features]
default = []
native-tts = ["native-tts-static"]
native-tts-core = ["dep:bzip2", "dep:num2words", "dep:reqwest", "dep:tar", "dep:sherpa-onnx"]
native-text-preprocessing = ["native-text-preprocessing-dynamic"]
native-text-preprocessing-core = ["dep:libtashkeel_base", "dep:ort", "dep:ort-sys", "libtashkeel_base/ort", "ort/ndarray"]
native-text-preprocessing-dynamic = ["native-text-preprocessing-core", "libtashkeel_base/ort-dylib", "ort/load-dynamic", "ort-sys/load-dynamic"]
native-text-preprocessing-static = ["native-text-preprocessing-core"]
native-tts-ios = ["native-tts-core", "native-text-preprocessing-static", "sherpa-onnx/static"]
native-tts-static = ["native-tts-core", "sherpa-onnx/static"]
native-tts-shared = ["native-tts-core", "native-text-preprocessing", "sherpa-onnx/shared"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-native-audio = "=1.0.5"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
num2words = { version = "1.2", optional = true }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.4", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
sherpa-onnx = { version = "1.13.4", optional = true, default-features = false }
libtashkeel_base = { version = "=1.5.0", optional = true, default-features = false }
ort = { version = "=2.0.0-rc.1", optional = true, default-features = false }
ort-sys = { version = "=2.0.0-rc.1", optional = true, default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
ammonia = "3.3"
encoding_rs = "0.8"
fs4 = { version = "1", features = ["sync"] }
image = { version = "=0.25.2", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
roxmltree = "0.20"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
percent-encoding = "2.3"
kuchikiki = "=0.8.8-speedreader"
tauri-plugin-opener = "=2.5.3"

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.image-webp]
opt-level = 2

[profile.dev.package.gif]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[patch.crates-io]
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }
