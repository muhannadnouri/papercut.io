[package]
name = "search-v2-embeddings"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
fastembed = { version = "=7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
rusqlite = { version = "0.32", features = ["bundled"] }
